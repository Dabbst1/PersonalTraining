<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Settings — Built For More</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Built For More</a>
  <ul class="nav-links">
    <li><a href="dashboard.html" class="client-tab">My Program</a></li>
    <li><a href="checkin.html" class="client-tab">Check In</a></li>
    <li><a href="messages.html" class="client-tab">Messages</a></li>
    <li><a href="account.html" class="client-tab active">Account</a></li>
    <li><a href="#" id="logout-link">Log Out</a></li>
  </ul>
</nav>

<main style="max-width: 500px;">
  <div class="section-label">Account Settings</div>
  <h1 class="section-title">Update Your Info.</h1>

  <div class="card" style="margin-bottom: 24px;">
    <h3 style="font-family:'Barlow Condensed',sans-serif; font-size:0.9rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--grey); margin-bottom:16px;">Email</h3>
    <form id="email-form">
      <div class="form-field">
        <label>Email Address</label>
        <input type="email" id="email-input" required>
      </div>
      <button type="submit" class="btn-primary" id="email-submit">Update Email</button>
      <div class="form-error" id="email-message"></div>
    </form>
  </div>

  <div class="card">
    <h3 style="font-family:'Barlow Condensed',sans-serif; font-size:0.9rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--grey); margin-bottom:16px;">Password</h3>
    <form id="password-form">
      <div class="form-field">
        <label>New Password</label>
        <input type="password" id="password-input" minlength="6" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary" id="password-submit">Update Password</button>
      <div class="form-error" id="password-message"></div>
    </form>
  </div>
</main>

<footer>
  <div class="footer-logo">Built For More</div>
  <p>&copy; 2026. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  async function init() {
    if (!supabaseClient) return;
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'auth.html';
      return;
    }
    document.getElementById('email-input').value = session.user.email || '';
  }

  document.getElementById('email-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('email-message');
    msg.className = 'form-error';
    msg.textContent = '';
    const btn = document.getElementById('email-submit');
    btn.disabled = true;
    btn.textContent = 'Updating...';

    const newEmail = document.getElementById('email-input').value.trim();
    const { error } = await supabaseClient.auth.updateUser({ email: newEmail });

    btn.disabled = false;
    btn.textContent = 'Update Email';

    if (error) {
      msg.textContent = error.message;
      return;
    }
    msg.className = 'form-success';
    msg.textContent = 'Check both your old and new email inboxes to confirm the change.';
  });

  document.getElementById('password-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('password-message');
    msg.className = 'form-error';
    msg.textContent = '';
    const btn = document.getElementById('password-submit');
    btn.disabled = true;
    btn.textContent = 'Updating...';

    const newPassword = document.getElementById('password-input').value;
    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

    btn.disabled = false;
    btn.textContent = 'Update Password';

    if (error) {
      msg.textContent = error.message;
      return;
    }
    msg.className = 'form-success';
    msg.textContent = 'Password updated.';
    document.getElementById('password-input').value = '';
  });

  document.getElementById('logout-link').addEventListener('click', async (e) => {
    e.preventDefault();
    if (supabaseClient) await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  });

  init();
</script>
</body>
</html>
