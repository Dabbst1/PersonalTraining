<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Admin — Built For More</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
  main { max-width: 1100px; }

  .inbox-layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 24px;
    margin-top: 24px;
    align-items: start;
  }
  .client-list {
    background: var(--card);
    border: 1px solid var(--border);
    max-height: 65vh;
    overflow-y: auto;
  }
  .client-list-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--light-grey);
    padding: 14px 16px;
    cursor: pointer;
    font-family: 'Barlow', sans-serif;
  }
  .client-list-item:hover { background: rgba(255,255,255,0.03); }
  .client-list-item.active { background: rgba(200,16,46,0.1); border-left: 3px solid var(--red); }
  .client-list-name { color: var(--white); font-size: 0.9rem; font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .client-list-preview { font-size: 0.8rem; color: var(--grey); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .unread-badge {
    background: var(--red); color: var(--white); font-size: 0.68rem; font-weight: 700;
    padding: 2px 7px; border-radius: 10px; flex-shrink: 0;
  }

  .thread-panel { display: flex; flex-direction: column; }
  .thread-header { font-family: 'Barlow Condensed', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--white); margin-bottom: 4px; }
  .thread-header-email { font-size: 0.8rem; color: var(--grey); margin-bottom: 16px; }

  .thread {
    background: var(--card);
    border: 1px solid var(--border);
    height: 55vh;
    min-height: 360px;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg-row { display: flex; }
  .msg-row.mine { justify-content: flex-end; }
  .msg-bubble {
    max-width: 78%;
    padding: 10px 14px;
    font-size: 0.9rem;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg-row.mine .msg-bubble { background: var(--red); color: var(--white); }
  .msg-row:not(.mine) .msg-bubble { background: var(--black); color: var(--light-grey); border: 1px solid var(--border); }
  .msg-time {
    font-size: 0.68rem; color: var(--grey); margin-top: 4px;
    font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.04em;
  }
  .msg-row.mine .msg-time { text-align: right; }
  .thread-empty { color: var(--grey); font-size: 0.9rem; text-align: center; margin: auto; }

  .compose { display: flex; gap: 10px; margin-top: 16px; }
  .compose textarea {
    flex: 1; background: var(--black); border: 1px solid var(--border); color: var(--white);
    padding: 12px 14px; font-family: 'Barlow', sans-serif; font-size: 0.9rem; resize: none; min-height: 48px;
  }
  .compose button { align-self: flex-end; }

  .no-thread-selected { color: var(--grey); font-size: 0.95rem; padding: 60px 20px; text-align: center; }

  .inbox-tabs { display: flex; gap: 8px; margin-top: 24px; margin-bottom: 8px; }
  .inbox-tab {
    background: var(--card); border: 1px solid var(--border); color: var(--light-grey);
    font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 10px 18px; cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  .inbox-tab.active { border-color: var(--red); color: var(--white); background: rgba(200,16,46,0.1); }
  .inbox-tab:hover:not(.active) { border-color: var(--grey); }
  .tab-badge {
    background: var(--red); color: var(--white); font-size: 0.68rem; font-weight: 700;
    padding: 2px 7px; border-radius: 10px;
  }

  .inquiry-card {
    background: var(--card); border: 1px solid var(--border); padding: 20px 24px; margin-top: 16px;
  }
  .inquiry-card.unread { border-left: 3px solid var(--red); }
  .inquiry-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .inquiry-name { font-family: 'Barlow Condensed', sans-serif; font-size: 1.05rem; font-weight: 700; color: var(--white); }
  .inquiry-email { font-size: 0.85rem; color: var(--grey); margin-top: 2px; }
  .inquiry-date { font-size: 0.78rem; color: var(--grey); white-space: nowrap; }
  .inquiry-fields { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; }
  .inquiry-field-label {
    font-family: 'Barlow Condensed', sans-serif; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--grey); margin-bottom: 3px;
  }
  .inquiry-field-value { font-size: 0.87rem; color: var(--light-grey); line-height: 1.5; }
  .inquiry-field-value.full { grid-column: span 2; }
  .inquiry-actions { margin-top: 18px; display: flex; gap: 10px; }

  @media (max-width: 800px) {
    .inquiry-fields { grid-template-columns: 1fr; }
    .inquiry-field-value.full { grid-column: span 1; }
    .inbox-layout { grid-template-columns: 1fr; }
    .client-list { max-height: 240px; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Built For More</a>
  <ul class="nav-links">
    <li><a href="dashboard.html">My Program</a></li>
    <li><a href="admin.html">Clients</a></li>
    <li><a href="#" id="logout-link">Log Out</a></li>
  </ul>
</nav>

<main>
  <div class="state-message" id="loading-state">
    <p>Loading...</p>
  </div>

  <div class="state-message" id="denied-state" style="display:none;">
    <div class="section-label" style="justify-content:center;">Access Denied</div>
    <h2 class="section-title">Admins Only.</h2>
  </div>

  <div id="inbox-content" style="display:none;">
    <div class="section-label">Admin</div>
    <h1 class="section-title">Messages.</h1>

    <div class="inbox-tabs">
      <button class="inbox-tab active" id="tab-client-messages">Client Messages</button>
      <button class="inbox-tab" id="tab-inquiries">Coaching Inquiries<span class="tab-badge" id="inquiries-badge" style="display:none;"></span></button>
    </div>

    <div class="inbox-layout" id="client-messages-panel">
      <div class="client-list" id="client-list"></div>
      <div class="thread-panel">
        <div id="thread-header-area"></div>
        <div class="thread" id="thread" style="display:none;"></div>
        <div class="no-thread-selected" id="no-thread-selected">Select a client on the left to view or start a conversation.</div>
        <div class="compose" id="compose-area" style="display:none;">
          <textarea id="compose-input" placeholder="Type a reply..."></textarea>
          <button class="btn-primary" id="send-btn">Send</button>
        </div>
        <div class="form-error" id="send-error"></div>
      </div>
    </div>

    <div id="inquiries-panel" style="display:none;">
      <div id="inquiries-list"></div>
    </div>
  </div>
</main>

<footer>
  <div class="footer-logo">Built For More</div>
  <p>&copy; 2026. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  let currentUser = null;
  let clients = [];
  let selectedClientId = null;
  let pollTimer = null;

  async function init() {
    if (!supabaseClient) {
      document.getElementById('loading-state').innerHTML = '<p>Account system is not connected yet.</p>';
      return;
    }
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'auth.html';
      return;
    }
    currentUser = session.user;

    await loadClientList();
    await loadInquiries();

    document.getElementById('loading-state').style.display = 'none';

    if (!clients) {
      document.getElementById('denied-state').style.display = 'block';
      return;
    }

    document.getElementById('inbox-content').style.display = 'block';
    pollTimer = setInterval(async () => {
      await loadClientList();
      await loadInquiries();
      if (selectedClientId) await loadThread(selectedClientId);
    }, 5000);
  }

  document.getElementById('tab-client-messages').addEventListener('click', () => {
    document.getElementById('tab-client-messages').classList.add('active');
    document.getElementById('tab-inquiries').classList.remove('active');
    document.getElementById('client-messages-panel').style.display = 'grid';
    document.getElementById('inquiries-panel').style.display = 'none';
  });
  document.getElementById('tab-inquiries').addEventListener('click', () => {
    document.getElementById('tab-inquiries').classList.add('active');
    document.getElementById('tab-client-messages').classList.remove('active');
    document.getElementById('client-messages-panel').style.display = 'none';
    document.getElementById('inquiries-panel').style.display = 'block';
  });

  let inquiries = [];

  async function loadInquiries() {
    const { data, error } = await supabaseClient
      .from('inquiries')
      .select('*')
      .order('created_at', { ascending: false });
    if (error) return;
    inquiries = data || [];
    renderInquiries();
  }

  function renderInquiries() {
    const badge = document.getElementById('inquiries-badge');
    const unreadCount = inquiries.filter(i => !i.read_at).length;
    if (unreadCount > 0) {
      badge.textContent = unreadCount;
      badge.style.display = 'inline-block';
    } else {
      badge.style.display = 'none';
    }

    const listEl = document.getElementById('inquiries-list');
    if (!inquiries.length) {
      listEl.innerHTML = '<p style="color:var(--grey); margin-top:16px;">No coaching applications yet.</p>';
      return;
    }

    const fieldLabels = {
      main_goal: 'Main Goal', goal_importance: 'Why This Matters', already_tried: 'Already Tried',
      biggest_obstacle: 'Biggest Obstacle', days_per_week: 'Days/Week', training_location: 'Training Location',
      injuries: 'Injuries / Limitations', coaching_support: 'Support Wanted', ready_to_invest: 'Ready To Invest?'
    };
    const fullWidthFields = ['goal_importance', 'already_tried', 'injuries'];

    listEl.innerHTML = inquiries.map(i => {
      const date = new Date(i.created_at).toLocaleDateString('default', { month: 'short', day: 'numeric', year: 'numeric' });
      const fieldsHtml = Object.keys(fieldLabels).map(key => {
        if (!i[key]) return '';
        return `<div class="inquiry-field-value ${fullWidthFields.includes(key) ? 'full' : ''}"><div class="inquiry-field-label">${fieldLabels[key]}</div>${escapeHtml(i[key])}</div>`;
      }).join('');

      return `
        <div class="inquiry-card ${!i.read_at ? 'unread' : ''}" data-id="${i.id}">
          <div class="inquiry-top">
            <div>
              <div class="inquiry-name">${escapeHtml(i.full_name)}</div>
              <div class="inquiry-email">${escapeHtml(i.email)}</div>
            </div>
            <div class="inquiry-date">${date}</div>
          </div>
          <div class="inquiry-fields">${fieldsHtml}</div>
          <div class="inquiry-actions">
            <a class="btn-primary" href="mailto:${encodeURIComponent(i.email)}?subject=${encodeURIComponent('Re: Your Coaching Application')}">Reply By Email</a>
            ${!i.read_at ? `<button class="btn-ghost mark-read-btn" data-id="${i.id}">Mark As Read</button>` : ''}
          </div>
        </div>
      `;
    }).join('');

    listEl.querySelectorAll('.mark-read-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        await supabaseClient.from('inquiries').update({ read_at: new Date().toISOString() }).eq('id', btn.dataset.id);
        await loadInquiries();
      });
    });
  }

  async function loadClientList() {
    const { data, error } = await supabaseClient.rpc('admin_message_overview');
    if (error) { clients = null; return; }
    clients = data || [];
    renderClientList();
  }

  function renderClientList() {
    const listEl = document.getElementById('client-list');
    if (!clients.length) {
      listEl.innerHTML = '<p style="padding:16px; color:var(--grey); font-size:0.85rem;">No clients yet.</p>';
      return;
    }
    listEl.innerHTML = clients.map(c => {
      const name = c.full_name || c.email;
      const preview = c.last_message ? c.last_message.slice(0, 60) : 'No messages yet';
      const unread = c.unread_count > 0 ? `<span class="unread-badge">${c.unread_count}</span>` : '';
      return `
        <button class="client-list-item ${c.client_id === selectedClientId ? 'active' : ''}" data-client-id="${c.client_id}">
          <div class="client-list-name">${escapeHtml(name)} ${unread}</div>
          <div class="client-list-preview">${escapeHtml(preview)}</div>
        </button>
      `;
    }).join('');

    listEl.querySelectorAll('.client-list-item').forEach(btn => {
      btn.addEventListener('click', () => selectClient(btn.dataset.clientId));
    });
  }

  async function selectClient(clientId) {
    selectedClientId = clientId;
    renderClientList();
    document.getElementById('no-thread-selected').style.display = 'none';
    document.getElementById('thread').style.display = 'flex';
    document.getElementById('compose-area').style.display = 'flex';

    const client = clients.find(c => c.client_id === clientId);
    document.getElementById('thread-header-area').innerHTML = `
      <div class="thread-header">${escapeHtml(client?.full_name || client?.email || 'Client')}</div>
      <div class="thread-header-email">${escapeHtml(client?.email || '')}</div>
    `;

    await loadThread(clientId);
  }

  async function loadThread(clientId) {
    const { data, error } = await supabaseClient
      .from('messages')
      .select('*')
      .eq('client_id', clientId)
      .order('created_at', { ascending: true });
    if (error) return;
    renderThread(data || []);

    // Mark the client's messages as read now that an admin is viewing this thread.
    const unread = (data || []).filter(m => m.sender_id === clientId && !m.read_at);
    if (unread.length) {
      await supabaseClient
        .from('messages')
        .update({ read_at: new Date().toISOString() })
        .in('id', unread.map(m => m.id));
      await loadClientList();
    }
  }

  function renderThread(messages) {
    const threadEl = document.getElementById('thread');
    const wasAtBottom = threadEl.scrollHeight - threadEl.scrollTop - threadEl.clientHeight < 40;

    if (!messages.length) {
      threadEl.innerHTML = '<p class="thread-empty">No messages yet — send the first one below.</p>';
      return;
    }

    threadEl.innerHTML = messages.map(m => {
      const mine = m.sender_id === currentUser.id;
      const time = new Date(m.created_at).toLocaleString('default', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      return `
        <div class="msg-row ${mine ? 'mine' : ''}">
          <div>
            <div class="msg-bubble">${escapeHtml(m.body)}</div>
            <div class="msg-time">${time}</div>
          </div>
        </div>
      `;
    }).join('');

    if (wasAtBottom) threadEl.scrollTop = threadEl.scrollHeight;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('send-btn').addEventListener('click', sendMessage);
  document.getElementById('compose-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  async function sendMessage() {
    if (!selectedClientId) return;
    const input = document.getElementById('compose-input');
    const errorEl = document.getElementById('send-error');
    const body = input.value.trim();
    if (!body) return;

    errorEl.textContent = '';
    const sendBtn = document.getElementById('send-btn');
    sendBtn.disabled = true;

    const { error } = await supabaseClient
      .from('messages')
      .insert({ client_id: selectedClientId, sender_id: currentUser.id, body });

    sendBtn.disabled = false;

    if (error) {
      errorEl.textContent = 'Could not send — please try again.';
      return;
    }
    input.value = '';
    await loadThread(selectedClientId);
    await loadClientList();
  }

  document.getElementById('logout-link').addEventListener('click', async (e) => {
    e.preventDefault();
    if (pollTimer) clearInterval(pollTimer);
    if (supabaseClient) await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  });

  window.addEventListener('beforeunload', () => { if (pollTimer) clearInterval(pollTimer); });

  init();
</script>
</body>
</html>
