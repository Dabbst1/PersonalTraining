<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Built For More</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Built For More</a>
</nav>

<main style="max-width: 460px;">
  <div class="section-label">Client Access</div>
  <h1 class="section-title">Set A New Password.</h1>

  <div class="card">
    <form id="reset-form">
      <div class="form-field">
        <label>New Password</label>
        <input type="password" id="new-password" placeholder="••••••••" minlength="6" required>
      </div>
      <button type="submit" class="btn-primary" id="submit-btn" style="width: 100%;">Update Password</button>
      <div class="form-error" id="form-message"></div>
    </form>
  </div>
</main>

<footer>
  <div class="footer-logo">Built For More</div>
  <p>&copy; 2026. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const form = document.getElementById('reset-form');
  const submitBtn = document.getElementById('submit-btn');
  const messageEl = document.getElementById('form-message');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    messageEl.textContent = '';
    messageEl.className = 'form-error';

    if (!supabaseClient) {
      messageEl.textContent = 'Account system is not connected yet.';
      return;
    }

    const newPassword = document.getElementById('new-password').value;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating...';

    // Supabase automatically establishes a temporary session from the reset
    // link's URL fragment when this page loads, so this just needs the new password.
    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

    submitBtn.disabled = false;
    submitBtn.textContent = 'Update Password';

    if (error) {
      messageEl.textContent = error.message;
      return;
    }

    messageEl.className = 'form-success';
    messageEl.textContent = 'Password updated! Redirecting...';
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
  });
</script>
</body>
</html>
